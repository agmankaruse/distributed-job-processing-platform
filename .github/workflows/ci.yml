name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  postgres-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: jobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JOBS_TEST_DATABASE_URL: postgresql+psycopg://jobs:test-only@localhost:5432/jobs_test
      JOBS_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: kubectl kustomize deploy/k8s/dependencies > /tmp/dependencies.yaml
      - run: kubectl set image --local -f deploy/k8s/workloads.yaml '*=example.invalid/jobs:test' -o yaml > /tmp/workloads.yaml
      - run: kubectl set image --local -f deploy/k8s/schema-job.yaml 'schema=example.invalid/jobs:test' -o yaml > /tmp/schema.yaml
      - run: bash -n scripts/deploy-gke.sh
