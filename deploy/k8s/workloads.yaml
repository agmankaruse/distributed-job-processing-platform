apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-api
  namespace: jobs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobs-api
  template:
    metadata:
      labels:
        app: jobs-api
    spec:
      containers:
        - name: api
          image: job-platform:local
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: jobs-secrets
            - configMapRef:
                name: jobs-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-worker
  namespace: jobs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jobs-worker
  template:
    metadata:
      labels:
        app: jobs-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: job-platform:local
          command: [python, -m, app.worker]
          envFrom:
            - secretRef:
                name: jobs-secrets
            - configMapRef:
                name: jobs-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
