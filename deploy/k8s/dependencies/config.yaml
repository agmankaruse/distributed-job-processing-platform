apiVersion: v1
kind: ConfigMap
metadata:
  name: jobs-config
data:
  REDIS_URL: redis://redis:6379/0
  CREATE_SCHEMA_ON_STARTUP: "false"
  JOB_LEASE_SECONDS: "30"
  WORKER_HEARTBEAT_SECONDS: "5"
  WORKER_HEARTBEAT_TTL_SECONDS: "15"
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-api
spec:
  type: ClusterIP
  selector:
    app: jobs-api
  ports:
    - port: 8000
      targetPort: 8000
